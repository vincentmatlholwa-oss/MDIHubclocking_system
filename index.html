<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MDIHub - Mafikeng Digital Innovation Hub Clocking System" />
    <meta name="theme-color" content="#1a56db" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MDIHub - Clocking System</title>
    <style>
      body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
      #loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; background: #f9fafb; }
      #loading .spinner { width: 48px; height: 48px; border: 4px solid #e5e7eb; border-top-color: #1a56db; border-radius: 50%; animation: spin 0.8s linear infinite; }
      #loading p { margin-top: 16px; color: #6b7280; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading MDIHub...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
